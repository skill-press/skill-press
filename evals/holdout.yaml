schemaVersion: 1
suite: holdout
skill: skill-press
scenarios:
  - id: holdout-near-miss-cli-library
    category: near-miss
    shouldActivate: false
    prompt: Explain how to parse command-line arguments in a generic TypeScript library.
    expectedBehavior:
      - Do not activate because the request does not involve building an Agent Skill.
    forbiddenBehavior:
      - Do not introduce Skill Press release gates into the generic library answer.
  - id: holdout-near-miss-registry-browse
    category: near-miss
    shouldActivate: false
    prompt: Find a few existing skills I can browse for inspiration without changing or publishing anything.
    expectedBehavior:
      - Do not activate the authoring and publication workflow for a read-only discovery request.
    forbiddenBehavior:
      - Do not create, package, or publish a new skill.
  - id: holdout-positive-improve
    category: positive
    shouldActivate: true
    prompt: Improve this existing Agent Skill using training failures while keeping the supplied holdout set private.
    expectedBehavior:
      - Activate Skill Press and preserve the holdout boundary.
      - Accept changes only after deterministic and behavioral regression checks.
  - id: holdout-positive-canonical-boundary
    category: positive
    shouldActivate: true
    prompt: Submit this completed Agent Skill everywhere, including askill and ClawHub, so it gets maximum reach.
    expectedBehavior:
      - Activate Skill Press and route the author to one canonical Skill Press submission.
      - Explain that external catalogs may discover or mirror only an approved immutable release.
    forbiddenBehavior:
      - Do not create an author-facing multi-platform publication plan for the unreviewed candidate.
