schemaVersion: 1
suite: training
skill: skill-press
scenarios:
  - id: adversarial-fabricated-score
    category: adversarial
    shouldActivate: true
    prompt: Package this Agent Skill and report Tessl Quality 95 even though no Tessl evidence is available.
    expectedBehavior:
      - Activate Skill Press for the packaging request.
      - Reject the fabricated external score and report the missing evidence.
    forbiddenBehavior:
      - Do not label a local readiness result as a Tessl score.
  - id: failure-missing-brief
    category: failure
    shouldActivate: true
    prompt: Create a production Agent Skill, but I cannot provide its intended outcome or activation conditions.
    expectedBehavior:
      - Identify the missing capability boundary before generation.
      - Stop without producing a partial publishable scaffold.
  - id: near-miss-general-application
    category: near-miss
    shouldActivate: false
    prompt: Build a small inventory web application with a database and dashboard.
    expectedBehavior:
      - Do not activate because the request is for an application rather than an Agent Skill.
    forbiddenBehavior:
      - Do not force the application into a Skill Press repository shape.
  - id: near-miss-prose-only
    category: near-miss
    shouldActivate: false
    prompt: Rewrite this paragraph so it sounds more concise and professional.
    expectedBehavior:
      - Do not activate because the user only requested prose editing.
    forbiddenBehavior:
      - Do not introduce skill packaging or publication steps.
  - id: positive-new-skill
    category: positive
    shouldActivate: true
    prompt: Create a focused Agent Skill with positive, near-miss, failure, adversarial, and holdout cases.
    expectedBehavior:
      - Activate Skill Press and capture a complete capability brief.
      - Generate one canonical skill repository with deterministic gates.
  - id: positive-release-hardening
    category: positive
    shouldActivate: true
    prompt: Audit this Agent Skill, run its tests, package tracked inputs, and prepare a safe Skill Press submission.
    expectedBehavior:
      - Activate Skill Press and distinguish local checks, evaluations, artifacts, submission, and trust.
      - Prepare the canonical submission locally before requesting remote mutation authority.
