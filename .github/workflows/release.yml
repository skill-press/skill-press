name: npm trusted release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: npm-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish verified package
    if: github.repository == 'mushanyoung/skillpress' && !github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the immutable release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - name: Set up the trusted publishing runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Verify release identity and runtime
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node scripts/verify-release.mjs
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Run release quality gates
        run: npm run check
      - name: Audit runtime dependencies
        run: npm run security:audit
      - name: Verify the packed CLI
        run: npm run package:verify
      - name: Publish with npm trusted publishing
        run: npm publish --access public
