schemaVersion: 2
project:
  name: skill-press
  version: 0.1.0
  description: Build, verify, submit, and install trusted agent skills with deterministic gates.
  license: MIT
  repository: https://github.com/skill-press/skill-press
  author:
    name: Mushan Yang
    github: mushanyoung
registry:
  namespace: skill-press
skill:
  name: skill-press
  path: skills/skill-press
  risk: moderate
quality:
  readinessMinimum: 90
  tesslQualityMinimum: 90
  tesslImpactMinimum: 90
  evidenceMaxAgeHours: 168
tests:
  commands:
    - name: repository quality gates
      argv: [npm, run, check]
      timeoutSeconds: 600
evaluation:
  repetitions: 3
  minimumSuccessRate: 0.9
  minimumImpactDelta: 0.1
  sandbox: docker
  network: none
improve:
  maxIterations: 5
  maxNoImprovement: 2
  maxTokens: 200000
  maxCostUsd: 100
  maxWallMinutes: 240
